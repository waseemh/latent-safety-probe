[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-safety-probe"
version = "0.1.0"
description = "Latent-space tamper detector for LLM safety training (held-out, calibrated activation probes)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.2",
    "transformers>=4.45",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "safetensors>=0.4",
    "accelerate>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
nnsight = ["nnsight>=0.3"]

[project.scripts]
lsprobe = "latent_safety_probe.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latent_safety_probe = ["concepts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
